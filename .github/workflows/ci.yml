name: CI

# Runs on macOS because that is the only platform Spritz targets, and because the tests exercise
# real sockets: the DLNA fakes bind loopback HTTP servers and the discovery paths walk the machine's
# network interfaces. A Linux runner would pass for the wrong reasons.
#
# Two jobs. `check` is the fast gate on every push: lint and the full test suite, no native build.
#
# `package` is the slow one, and it exists because a green build is not a working app. The first
# .dmg this repo ever produced contained no native addons at all — build.files excluded the
# directory they are compiled into — and it installed, launched, and would have played nothing.
# Nothing failed. The build was green and the package was hollow, and only opening the result showed
# it. So CI now compiles the addons and runs the same output verification `npm run dist` does.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # --ignore-scripts: postinstall runs electron-builder install-app-deps, which downloads an
      # Electron binary and rebuilds native modules. Neither is needed to lint or to run these
      # tests, and both are slow and flaky on a hosted runner.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      # SPRITZ_SOAP_TIMEOUT_SCALE is set by the test script itself (see package.json): the DLNA
      # timeout regressions have to wait a timeout out, and at production scale that alone took 30s.
      - name: Test
        run: npm test

  # Compile the addons and check what a package would actually contain. Slower and needs Homebrew's
  # mpv for libmpv and its headers, so it does not gate the fast feedback above — but it is the only
  # thing that can catch a build that succeeds and produces something unusable.
  package:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # libmpv + headers for native/mpv. ffmpeg here is Homebrew's, which lacks libass and zscale —
      # fine, because nothing in this job depends on those; the capability tests skip when the
      # purpose-built binary is absent rather than failing for the wrong reason.
      - name: Install libmpv
        run: brew install mpv

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native addons
        run: npm run rebuild

      # The addons must exist and must load. A .node that compiled but cannot resolve its libraries
      # is the failure that shipped, and it looks identical to success in a file listing.
      - name: Check the addons were built
        run: |
          set -e
          for m in mpv airplay nowplaying; do
            f=$(ls native/$m/build/Release/*.node 2>/dev/null | head -1)
            if [ -z "$f" ]; then echo "::error::native/$m produced no .node"; exit 1; fi
            echo "built $f"
          done

      # What a package would contain, without building a 200 MB disk image on every push. The staged
      # app is the same tree the .dmg is made from, so the verification is the same one.
      - name: Stage the app and verify its contents
        run: |
          set -e
          npm i -D electron-builder --ignore-scripts
          # bin/ holds the purpose-built ffmpeg, which is not in git and cannot be rebuilt here.
          # Stand in Homebrew's so the packaging paths are exercised; the verifier checks that the
          # binaries are present and self-contained, not which build they are.
          mkdir -p bin
          cp "$(brew --prefix)/bin/ffmpeg" bin/ffmpeg
          cp "$(brew --prefix)/bin/ffprobe" bin/ffprobe
          curl -sL -o bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          chmod +x bin/yt-dlp
          ./build/bundle-dylibs.sh /tmp/ffstage bin/ffmpeg bin/ffprobe
          cp -R /tmp/ffstage/ bin/
          ./build/bundle-dylibs.sh /tmp/mpvstage native/mpv/build/Release/mpv_render.node
          cp -R /tmp/mpvstage/ native/mpv/build/Release/
          node build/preflight-dist.js
          npx electron-builder --mac --dir --arm64
          node build/verify-package.js
